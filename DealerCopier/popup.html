<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dealer to Marketplace</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 13px;
    background: #f0f2f5;
    color: #1c1e21;
    width: 360px;
    min-height: 100px;
  }
  header {
    background: #1877f2;
    color: #fff;
    padding: 10px 14px;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .3px;
  }
  #body { padding: 10px 12px 12px; }
  .card {
    background: #fff;
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 10px;
    box-shadow: 0 1px 3px rgba(0,0,0,.1);
  }
  .card-title {
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: #65676b;
    margin-bottom: 8px;
  }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
  .field label {
    display: block;
    font-size: 11px;
    color: #65676b;
    margin-bottom: 2px;
    font-weight: 500;
  }
  .field input {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 5px 7px;
    font-size: 13px;
    outline: none;
    transition: border-color .15s;
  }
  .field input:focus { border-color: #1877f2; }
  textarea {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 7px;
    font-size: 12px;
    font-family: inherit;
    resize: vertical;
    outline: none;
    line-height: 1.5;
  }
  textarea:focus { border-color: #1877f2; }
  .btn-row { display: flex; gap: 8px; }
  .btn {
    flex: 1;
    padding: 9px 10px;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s;
  }
  .btn:hover { opacity: .88; }
  .btn-primary { background: #1877f2; color: #fff; }
  .btn-secondary { background: #e4e6eb; color: #1c1e21; }
  .loading {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 0;
    color: #65676b;
    justify-content: center;
  }
  .spinner {
    width: 20px; height: 20px;
    border: 3px solid #e4e6eb;
    border-top-color: #1877f2;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .no-listing {
    text-align: center;
    padding: 24px 16px 12px;
    color: #65676b;
    line-height: 1.5;
  }
  .no-listing p { margin-top: 10px; font-size: 13px; }
  #toast {
    position: fixed;
    bottom: 10px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #333;
    color: #fff;
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 12px;
    opacity: 0;
    transition: opacity .2s, transform .2s;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<header>Dealer to Marketplace</header>
<div id="body">
  <div class="loading"><div class="spinner"></div>Scanning page…</div>
</div>
<div id="toast"></div>
<script src="popup.js"></script>
</body>
</html>
