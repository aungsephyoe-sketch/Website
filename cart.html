<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart — Ares Pantheon</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .page-header {
            padding: 60px 0 32px;
            border-bottom: 1px solid #e8e8e8;
        }
        .page-header h1 {
            font-family: var(--serif);
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 400;
            letter-spacing: 0.02em;
        }
        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 60px;
            align-items: start;
            padding: 48px 0 100px;
        }
        .cart-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 0;
        }
        .cart-empty p {
            font-family: var(--serif);
            font-size: 1.4rem;
            font-weight: 300;
            color: var(--gray);
            margin-bottom: 32px;
        }
        .cart-empty a {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            padding: 16px 48px;
            background: var(--black);
            color: var(--white);
            transition: opacity 0.2s;
        }
        .cart-empty a:hover { opacity: 0.7; }

        /* Cart items */
        .cart-items { display: flex; flex-direction: column; }
        .cart-item {
            display: grid;
            grid-template-columns: 100px 1fr auto;
            gap: 20px;
            align-items: center;
            padding: 24px 0;
            border-bottom: 1px solid #e8e8e8;
        }
        .cart-item-img {
            width: 100px;
            height: 120px;
            overflow: hidden;
            background: var(--off-white);
            flex-shrink: 0;
        }
        .cart-item-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .cart-item-info { display: flex; flex-direction: column; gap: 6px; }
        .cart-item-name {
            font-family: var(--serif);
            font-size: 1.1rem;
            font-weight: 400;
        }
        .cart-item-meta {
            font-size: 0.75rem;
            color: var(--gray);
            letter-spacing: 0.05em;
        }
        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 8px;
        }
        .qty-btn {
            width: 28px;
            height: 28px;
            border: 1px solid #ddd;
            background: none;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .qty-btn:hover { background: var(--black); color: var(--white); border-color: var(--black); }
        .qty-num { font-size: 0.85rem; font-weight: 500; min-width: 20px; text-align: center; }
        .cart-item-remove {
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--gray);
            cursor: pointer;
            background: none;
            border: none;
            margin-top: 4px;
            transition: color 0.2s;
            text-align: left;
        }
        .cart-item-remove:hover { color: var(--black); }
        .cart-item-price {
            font-size: 1rem;
            font-weight: 500;
            white-space: nowrap;
        }

        /* Summary */
        .cart-summary {
            position: sticky;
            top: 88px;
            background: var(--off-white);
            padding: 36px;
        }
        .cart-summary h2 {
            font-family: var(--serif);
            font-size: 1.3rem;
            font-weight: 400;
            margin-bottom: 28px;
            letter-spacing: 0.02em;
        }
        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            margin-bottom: 14px;
            color: var(--gray);
        }
        .summary-row.total {
            color: var(--black);
            font-weight: 600;
            font-size: 1rem;
            padding-top: 16px;
            margin-top: 8px;
            border-top: 1px solid #ddd;
        }
        .checkout-btn {
            width: 100%;
            padding: 18px;
            background: var(--black);
            color: var(--white);
            border: none;
            font-family: var(--sans);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 24px;
            transition: opacity 0.2s;
            display: block;
            text-align: center;
            text-decoration: none;
        }
        .checkout-btn:hover { opacity: 0.75; }
        .continue-link {
            display: block;
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--gray);
            margin-top: 16px;
            text-decoration: underline;
            text-underline-offset: 3px;
        }
        .continue-link:hover { color: var(--black); }
        .summary-shipping {
            font-size: 0.75rem;
            color: var(--gray);
            text-align: center;
            margin-top: 16px;
        }

        @media (max-width: 768px) {
            .cart-layout {
                grid-template-columns: 1fr;
                gap: 40px;
                padding: 32px 0 80px;
            }
            .cart-summary { position: static; }
            .cart-item { grid-template-columns: 80px 1fr auto; gap: 14px; }
            .cart-item-img { width: 80px; height: 96px; }
        }
    </style>
</head>
<body>

    <!-- Announcement Bar -->
    <div class="announcement-bar">
        <p>Complimentary Shipping on All Orders</p>
    </div>

    <!-- Navigation -->
    <nav class="nav" id="nav">
        <div class="nav-inner">
            <div class="nav-left">
                <button class="nav-menu-btn" id="menuBtn" aria-label="Menu">
                    <span></span><span></span><span></span>
                </button>
                <div class="nav-links">
                    <a href="index.html#collection" class="nav-link">Collections</a>
                    <a href="index.html#editorial" class="nav-link">Editorial</a>
                    <a href="index.html#craft" class="nav-link">Craft</a>
                    <a href="index.html#world" class="nav-link">World of Ares</a>
                </div>
            </div>
            <a href="index.html" class="nav-logo">
                <span class="nav-logo-text">Ares Pantheon</span>
            </a>
            <div class="nav-right">
                <a href="index.html" class="nav-icon" aria-label="Search">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                </a>
                <a href="#" class="nav-icon" aria-label="Account">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </a>
                <a href="cart.html" class="nav-icon nav-cart" aria-label="Cart" style="position:relative">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
                    <span class="cart-count" id="cartCount" style="display:none"></span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
        <div class="mobile-menu-inner">
            <a href="index.html#collection" class="mobile-link">Collections</a>
            <a href="index.html#editorial" class="mobile-link">Editorial</a>
            <a href="index.html#craft" class="mobile-link">Craft</a>
            <a href="index.html#world" class="mobile-link">World of Ares</a>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h1>Your Cart</h1>
        </div>

        <div class="cart-layout" id="cartLayout">
            <!-- Populated by JS -->
        </div>
    </div>

    <script src="cart.js"></script>
    <script>
        // Nav scroll
        const nav = document.getElementById('nav');
        window.addEventListener('scroll', () => {
            nav.classList.toggle('scrolled', window.scrollY > 10);
        }, { passive: true });

        // Mobile menu
        const menuBtn = document.getElementById('menuBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        menuBtn.addEventListener('click', () => {
            menuBtn.classList.toggle('active');
            mobileMenu.classList.toggle('active');
            document.body.style.overflow = mobileMenu.classList.contains('active') ? 'hidden' : '';
        });
        document.querySelectorAll('.mobile-link').forEach(link => {
            link.addEventListener('click', () => {
                menuBtn.classList.remove('active');
                mobileMenu.classList.remove('active');
                document.body.style.overflow = '';
            });
        });

        renderCart();
    </script>
</body>
</html>
